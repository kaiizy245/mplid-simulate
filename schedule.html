<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule — MPL ID Simulate</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .week-section { margin-bottom: 40px; }
    .week-label {
      font-family: var(--font-mono); font-size: 0.6875rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--color-text-muted); margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .week-label::after { content:""; flex:1; height:1px; background:var(--color-border); }

    .match-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 11px 0;
      border-bottom: 1px solid var(--color-border); flex-wrap: wrap;
    }
    .match-row:last-child { border-bottom: none; }

    .match-teams-cell {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-mono); font-size: 0.875rem; flex: 1;
    }
    .match-score {
      font-family: var(--font-mono); font-size: 0.875rem;
      min-width: 60px; text-align: center;
    }
    .match-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .tag-format {
      font-family: var(--font-mono); font-size: 0.5625rem;
      letter-spacing: 0.08em; color: var(--color-text-muted);
      padding: 2px 6px; border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
    }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(8,11,15,0.88); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-box {
      background: var(--color-surface-2,#111820);
      border: 1px solid var(--color-border-bright,#2E3D50);
      border-radius: var(--radius-md);
      width: 100%; max-width: 780px; max-height: 90vh;
      overflow-y: auto; padding: 24px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
    .modal-subtitle { font-family: var(--font-mono); font-size: 0.625rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-muted); }
    .modal-matchup  { font-family: var(--font-mono); font-size: 1.125rem; font-weight: 700; color: var(--color-text-bright,#F0F4F8); margin-top: 4px; }
    .close-btn {
      font-family: var(--font-mono); font-size: 0.6875rem;
      background: none; border: 1px solid var(--color-border);
      color: var(--color-text-muted); padding: 4px 10px; cursor: pointer;
      border-radius: var(--radius-sm);
    }
    .close-btn:hover { border-color: var(--color-red,#F87171); color: var(--color-red,#F87171); }

    .game-tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 1px solid var(--color-border); }
    .game-tab {
      font-family: var(--font-mono); font-size: 0.625rem; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 8px 16px; cursor: pointer; color: var(--color-text-muted);
      border-bottom: 2px solid transparent; transition: color 0.1s, border-color 0.1s;
    }
    .game-tab:hover { color: var(--color-text-bright,#F0F4F8); }
    .game-tab.active { color: var(--color-cyan,#38BDF8); border-bottom-color: var(--color-cyan,#38BDF8); }

    .draft-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: start; }
    .draft-side { display: flex; flex-direction: column; gap: 8px; }
    .draft-side-label { font-family: var(--font-mono); font-size: 0.625rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
    .draft-vs-col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding-top: 24px; }
    .game-winner-badge {
      font-family: var(--font-mono); font-size: 0.5rem; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 3px 8px; border-radius: var(--radius-sm);
      background: var(--color-green-soft,#22C55E1A); color: var(--color-green,#22C55E);
      border: 1px solid rgba(34,197,94,0.3);
    }
    .ban-list { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
    .ban-chip {
      font-family: var(--font-mono); font-size: 0.625rem;
      padding: 2px 7px; background: var(--color-red-soft,#F871711A);
      color: var(--color-red,#F87171); border: 1px solid rgba(248,113,113,0.2);
      border-radius: var(--radius-sm); text-decoration: line-through; opacity: 0.8;
    }
    .pick-row {
      display: flex; align-items: center; gap: 8px; padding: 5px 8px;
      background: rgba(255,255,255,0.02); border: 1px solid var(--color-border);
      border-radius: var(--radius-sm); margin-bottom: 4px;
    }
    .pick-hero { font-family: var(--font-mono); font-size: 0.8125rem; color: var(--color-text-bright,#F0F4F8); }
    .pick-role { font-family: var(--font-mono); font-size: 0.5625rem; color: var(--color-text-muted); margin-left: auto; }

    @media(max-width:600px){
      .draft-grid { grid-template-columns: 1fr; }
      .draft-vs-col { flex-direction: row; padding-top: 0; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="navbar__brand">MPL ID <span>Simulate</span></div>
    <ul class="navbar__tabs">
      <li class="navbar__tab"><a href="home.html">Home</a></li>
      <li class="navbar__tab"><a href="index.html">Teams</a></li>
      <li class="navbar__tab"><a href="players.html">Players</a></li>
      <li class="navbar__tab is-active">Schedule</li>
      <li class="navbar__tab"><a href="standings.html">Standings</a></li>
      <li class="navbar__tab"><a href="playoff.html">Playoff</a></li>
      <li class="navbar__tab"><a href="analytics.html">Analytics</a></li>
      <li class="navbar__tab"><a href="power-ranking.html">Power Ranking</a></li>
    </ul>
  </nav>

  <main class="container" style="padding-top:36px; padding-bottom:48px;">
    <h1 data-type="Schedule">Schedule</h1>
    <p class="text-muted" style="margin-top:8px; margin-bottom:24px;">
      Jadwal pertandingan MPL ID Season 18 — Week 1 s/d Week 9.
    </p>

    <div style="margin-bottom:24px; display:flex; gap:8px; flex-wrap:wrap;">
      <button id="btn-sim-all" class="btn btn--primary">Simulasikan Semua</button>
      <button id="btn-reset"   class="btn">Reset Simulasi</button>
    </div>

    <div id="schedule-container">
      <p class="text-muted">Memuat jadwal...</p>
    </div>
  </main>

  <!-- Modal detail draft -->
  <div id="match-modal" style="display:none;" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <div class="modal-subtitle" id="modal-subtitle">Detail Pertandingan</div>
          <div class="modal-matchup" id="modal-matchup">—</div>
        </div>
        <button class="close-btn" onclick="closeModal()">✕ Tutup</button>
      </div>
      <div class="game-tabs"  id="game-tabs"></div>
      <div id="game-content"></div>
    </div>
  </div>

  <script src="sim.js"></script>
  <script src="terminal.js"></script>
  <script>
    let teamsCache  = [];
    let scheduleCache = [];
    let currentMatch = null;

    const nmTim    = id => teamsCache.find(t=>t.id===id)?.name || id;
    const warnaTim = id => teamsCache.find(t=>t.id===id)?.color || 'inherit';
    const fmtTgl   = d  => new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short'});

    /* ── Render schedule list per week ── */
    function renderSchedule() {
      const container = document.getElementById('schedule-container');
      const weeks = {};
      scheduleCache.forEach(m => { if(!weeks[m.week]) weeks[m.week]=[]; weeks[m.week].push(m); });

      container.innerHTML = '';
      Object.keys(weeks).sort((a,b)=>+a-+b).forEach(w => {
        const matches = weeks[w];
        const done    = matches.filter(m=>m.status==='finished').length;

        const section = document.createElement('div');
        section.className = 'week-section';

        const rows = matches.map(m => {
          const selesai = m.status === 'finished';
          const aWin    = m.score_a > m.score_b;

          const teamsCell = `
            <div class="match-teams-cell">
              <span style="color:${warnaTim(m.team_a)};font-weight:${selesai&&aWin?'700':'400'};opacity:${selesai&&!aWin?.45:1};">${nmTim(m.team_a)}</span>
              <span style="color:var(--color-text-muted);font-size:.75rem;">VS</span>
              <span style="color:${warnaTim(m.team_b)};font-weight:${selesai&&!aWin?'700':'400'};opacity:${selesai&&aWin?.45:1};">${nmTim(m.team_b)}</span>
            </div>`;

          const scoreCell = selesai
            ? `<div class="match-score">
                <span class="score-win">${m.score_a}</span>
                <span style="color:var(--color-text-muted);margin:0 4px;">–</span>
                <span class="${aWin?'score-loss':'score-win'}">${m.score_b}</span>
               </div>`
            : `<div class="match-score" style="color:var(--color-text-muted);font-size:.75rem;">${fmtTgl(m.date)} · ${m.time}</div>`;

          // Tombol aksi
          let aksiHtml = `<span class="tag-format">${m.format}</span>`;
          if (selesai) {
            const hasGames = m.games && m.games.length > 0;
            if (hasGames) {
              // Simpan match data ke dataset supaya tidak ada masalah escape karakter
              aksiHtml += `<button class="btn" style="font-size:.5625rem;padding:4px 10px;" data-match-id="${m.match_id}">Detail Draft</button>`;
            }
          } else {
            aksiHtml += `<button class="btn btn--primary" style="font-size:.5625rem;padding:4px 10px;" data-sim-id="${m.match_id}" data-fmt="${m.format}" data-ta="${m.team_a}" data-tb="${m.team_b}">Sim</button>`;
          }

          return `<div class="match-row">${teamsCell}${scoreCell}<div class="match-actions">${aksiHtml}</div></div>`;
        }).join('');

        section.innerHTML = `
          <div class="week-label">// Week ${w} <span style="color:var(--color-border-bright,#2E3D50);margin-left:4px;">${done}/${matches.length} selesai</span></div>
          <div class="card">${rows}</div>`;

        container.appendChild(section);
      });

      // Event delegation — semua tombol ditangani di sini, tidak ada inline onclick
      container.querySelectorAll('[data-sim-id]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id  = btn.dataset.simId;
          const fmt = btn.dataset.fmt;
          const tA  = btn.dataset.ta;
          const tB  = btn.dataset.tb;
          btn.disabled = true;
          btn.textContent = '...';
          const result = simulasikanSatu(id, fmt, tA, tB);
          await generateDetailedStatsForMatch(id, scheduleCache.find(m=>m.match_id===id)?.week || 0, tA, tB, result.games);
          await reloadSchedule();
        });
      });

      container.querySelectorAll('[data-match-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id    = btn.dataset.matchId;
          const match = scheduleCache.find(m => m.match_id === id);
          if (match) openModal(match);
        });
      });
    }

    async function reloadSchedule() {
      scheduleCache = await getScheduleGabungan();
      renderSchedule();
    }

    async function init() {
      const [tr] = await Promise.all([fetch('teams.json')]);
      teamsCache = await tr.json();
      await reloadSchedule();
    }

    /* ── Simulasikan Semua ── */
    document.getElementById('btn-sim-all').addEventListener('click', async () => {
      document.getElementById('btn-sim-all').disabled = true;
      document.getElementById('btn-sim-all').textContent = 'Menyimulasikan...';
      const jadwal = await getScheduleGabungan();
      await simulasikanSemua(jadwal);
      // Generate stats untuk semua yang baru selesai
      const baru = jadwal.filter(m => m.status !== 'finished');
      for (const m of baru) {
        const ov = JSON.parse(localStorage.getItem(SIM_KEY) || '{}');
        const h  = ov[m.match_id];
        if (h && h.games) await generateDetailedStatsForMatch(m.match_id, m.week, m.team_a, m.team_b, h.games);
      }
      document.getElementById('btn-sim-all').disabled = false;
      document.getElementById('btn-sim-all').textContent = 'Simulasikan Semua';
      await reloadSchedule();
    });

    /* ── Reset ── */
    document.getElementById('btn-reset').addEventListener('click', async () => {
      resetSimulasi();
      await reloadSchedule();
    });

    /* ── Modal detail draft ── */
    function openModal(match) {
      currentMatch = match;
      document.getElementById('modal-subtitle').textContent = `Week ${match.week} · ${match.format}`;
      document.getElementById('modal-matchup').innerHTML =
        `<span style="color:${warnaTim(match.team_a)};">${nmTim(match.team_a)}</span>
         <span style="color:var(--color-text-muted);margin:0 10px;">${match.score_a} – ${match.score_b}</span>
         <span style="color:${warnaTim(match.team_b)};">${nmTim(match.team_b)}</span>`;

      const tabs = document.getElementById('game-tabs');
      tabs.innerHTML = (match.games || []).map((g,i) =>
        `<div class="game-tab ${i===0?'active':''}" data-idx="${i}">Game ${g.game}</div>`
      ).join('');

      tabs.querySelectorAll('.game-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.querySelectorAll('.game-tab').forEach(t=>t.classList.remove('active'));
          tab.classList.add('active');
          renderGameContent(+tab.dataset.idx);
        });
      });

      renderGameContent(0);
      document.getElementById('match-modal').style.display = 'flex';
    }

    function renderGameContent(idx) {
      const game = currentMatch.games[idx];
      const m    = currentMatch;
      const content = document.getElementById('game-content');

      if (!game) { content.innerHTML = '<p class="text-muted">Data game tidak tersedia.</p>'; return; }

      const wName  = nmTim(game.winner);
      const wColor = warnaTim(game.winner);
      const d      = game.draft;

      content.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
          <span class="sys-label" style="font-family:var(--font-mono);font-size:.5625rem;letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-muted);">Pemenang:</span>
          <span style="font-family:var(--font-mono);font-weight:700;color:${wColor};">${wName}</span>
          <span class="game-winner-badge">WIN</span>
        </div>
        <div class="draft-grid">
          <div class="draft-side">
            <div class="draft-side-label" style="color:${warnaTim(m.team_a)};">${nmTim(m.team_a)}</div>
            <div style="margin-bottom:8px;">
              <div style="font-family:var(--font-mono);font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:4px;">Bans</div>
              <div class="ban-list">${(d.bans_a||[]).map(h=>`<span class="ban-chip">${h}</span>`).join('')}</div>
            </div>
            <div>
              <div style="font-family:var(--font-mono);font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:4px;">Picks</div>
              ${(d.picks_a||[]).map(p=>`<div class="pick-row"><span class="pick-hero">${p.name}</span><span class="pick-role">${p.role}</span></div>`).join('')}
            </div>
          </div>
          <div class="draft-vs-col"><span style="font-family:var(--font-mono);font-size:.75rem;color:var(--color-text-muted);">VS</span></div>
          <div class="draft-side">
            <div class="draft-side-label" style="color:${warnaTim(m.team_b)};">${nmTim(m.team_b)}</div>
            <div style="margin-bottom:8px;">
              <div style="font-family:var(--font-mono);font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:4px;">Bans</div>
              <div class="ban-list">${(d.bans_b||[]).map(h=>`<span class="ban-chip">${h}</span>`).join('')}</div>
            </div>
            <div>
              <div style="font-family:var(--font-mono);font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-muted);margin-bottom:4px;">Picks</div>
              ${(d.picks_b||[]).map(p=>`<div class="pick-row"><span class="pick-hero">${p.name}</span><span class="pick-role">${p.role}</span></div>`).join('')}
            </div>
          </div>
        </div>`;
    }

    function closeModal() {
      document.getElementById('match-modal').style.display = 'none';
      currentMatch = null;
    }

    document.getElementById('match-modal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeModal();
    });

    init();
  </script>
</body>
</html>
